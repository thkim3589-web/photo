name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Create WWW
        run: |
          mkdir -p www
          cp index.html www/index.html
          # 앱 안의 "새 버전 확인"이 비교할 빌드 번호를 주입
          sed -i "s/window.APP_BUILD = 0;/window.APP_BUILD = ${{ github.run_number }};/" www/index.html
          grep -c "window.APP_BUILD = ${{ github.run_number }};" www/index.html

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply Native Code Patches
        run: |
          PKG_DIR="android/app/src/main/java/com/thkim/photo"
          mkdir -p "$PKG_DIR"
          cp native-patches/MainActivity.java "$PKG_DIR/MainActivity.java"
          cp native-patches/SaveFilePlugin.java "$PKG_DIR/SaveFilePlugin.java"

      - name: Apply App Icon
        run: |
          RES="android/app/src/main/res"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp native-patches/icons/mipmap-$d/*.png "$RES/mipmap-$d/"
          done
          cp native-patches/icons/ic_launcher_background.xml "$RES/values/ic_launcher_background.xml"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with fixed key
        run: |
          set -e
          # 빌드마다 서명 키가 바뀌면 기존 앱 위에 덮어 설치가 안 되므로, 저장소의 고정 키로 서명한다
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          export KS_PASS=$(grep -m1 'Key store password:' signing-key-info.txt | sed 's/^[^:]*: *//' | tr -d '\r')
          export KEY_PASS=$(grep -m1 'Key password:' signing-key-info.txt | sed 's/^[^:]*: *//' | tr -d '\r')
          OUT=android/app/build/outputs/apk/debug
          "$APKSIGNER" sign --ks signing.keystore --ks-key-alias my-key-alias \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out $OUT/app-signed.apk $OUT/app-debug.apk
          "$APKSIGNER" verify --print-certs $OUT/app-signed.apk | head -3

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-signed.apk 현장사진관리.apk
          cp android/app/build/outputs/apk/debug/app-signed.apk photo-app.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: 현장사진관리.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 현장사진관리 최신 APK
          body: |
            build:${{ github.run_number }}
            매 push마다 자동으로 다시 빌드된 최신 APK입니다. (설치 전 "출처를 알 수 없는 앱 설치" 허용 필요)
          files: photo-app.apk
          make_latest: false
