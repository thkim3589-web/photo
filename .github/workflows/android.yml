name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Create WWW
        run: |
          mkdir -p www
          cp index.html www/index.html
          # 외부 CDN 대신 저장소에 포함한 라이브러리를 앱에 함께 넣는다 (오프라인 동작 + 보안)
          cp -r lib www/lib
          # 앱 안의 "새 버전 확인"이 비교할 빌드 번호를 주입
          sed -i "s/window.APP_BUILD = 0;/window.APP_BUILD = ${{ github.run_number }};/" www/index.html
          grep -c "window.APP_BUILD = ${{ github.run_number }};" www/index.html

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply Native Code Patches
        run: |
          PKG_DIR="android/app/src/main/java/com/thkim/photo"
          mkdir -p "$PKG_DIR"
          cp native-patches/MainActivity.java "$PKG_DIR/MainActivity.java"
          cp native-patches/SaveFilePlugin.java "$PKG_DIR/SaveFilePlugin.java"

      - name: Harden Android Build Settings
        run: |
          set -e
          GRADLE="android/app/build.gradle"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 1) 디버그 플래그 끄기 (USB 디버깅으로 앱 데이터 접근 방지)
          sed -i '0,/buildTypes {/s//buildTypes {\n        debug {\n            debuggable false\n        }/' "$GRADLE"
          # 2) 빌드마다 versionCode 증가
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE"
          # 3) 백업 허용 끄기, 평문 통신 금지
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"\n        android:usesCleartextTraffic="false"/' "$MANIFEST"
          # 적용 확인 (하나라도 빠지면 빌드 실패)
          grep -q "debuggable false" "$GRADLE"
          grep -q "versionCode ${{ github.run_number }}" "$GRADLE"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"

      - name: Apply App Icon
        run: |
          RES="android/app/src/main/res"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp native-patches/icons/mipmap-$d/*.png "$RES/mipmap-$d/"
          done
          cp native-patches/icons/ic_launcher_background.xml "$RES/values/ic_launcher_background.xml"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # 서명 키는 저장소가 아니라 GitHub Secrets에만 보관한다
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::서명용 비밀값(KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)이 등록되지 않았습니다. Settings > Secrets and variables > Actions 에서 등록하세요."
            exit 1
          fi
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          KS_FILE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS_FILE"
          export KS_PASS="$KEYSTORE_PASSWORD" KEY_PASS="$KEY_PASSWORD"
          OUT=android/app/build/outputs/apk/debug
          "$APKSIGNER" sign --ks "$KS_FILE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out $OUT/app-signed.apk $OUT/app-debug.apk
          rm -f "$KS_FILE"
          "$APKSIGNER" verify --print-certs $OUT/app-signed.apk | head -3

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-signed.apk 현장사진관리.apk
          cp android/app/build/outputs/apk/debug/app-signed.apk photo-app.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: 현장사진관리.apk

      - name: Remove stale release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 예전 한글 이름 때문에 default.apk로 올라갔던 파일이 남아 있으면 정리
          gh release delete-asset latest-apk default.apk -y --repo "${{ github.repository }}" || true

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 현장사진관리 최신 APK
          body: |
            build:${{ github.run_number }}
            매 push마다 자동으로 다시 빌드된 최신 APK입니다. (설치 전 "출처를 알 수 없는 앱 설치" 허용 필요)
          files: photo-app.apk
          make_latest: false
